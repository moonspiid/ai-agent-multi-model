name: Build APK
on:
push:
branches: [ master ]
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v3
- name: Set up Node.js
uses: actions/setup-node@v3
with:
node-version: 18
- name: Install PWA Tool
run: npm install -g pwa2apk
- name: Generate APK
run: pwa2apk --url "https://moonspiid.github.io/ai-agent-multi-model/" --name "AI Agent" --icon "icon-512.png"
- name: Upload APK
uses: actions/upload-artifact@v3
with:
name: app-release
path: app-release.apk
